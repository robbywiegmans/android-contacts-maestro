name: Maestro Android Regression Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  maestro-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -Maestro https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            adb wait-for-device
            maestro test . --format junit --output report.xml --continue-on-failure

      - name: Publish Test Results (JUnit)
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'report.xml'
          check_name: 'Maestro Test Results'
